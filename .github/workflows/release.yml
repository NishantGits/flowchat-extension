name: Release to main

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build
        run: |
          cd extension
          npm install
          npm run build

      - name: Push to main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b main || git checkout main
          
          # Remove all files first to keep main clean
          rm -rf extension/ README-DEV.md .github/ extension/package.json extension/package-lock.json extension/src/ extension/tsconfig.json extension/svelte.config.js extension/tailwind.config.js extension/postcss.config.js extension/vite.config.ts extension/.gitignore extension/public/ vite.config.ts .gitignore favicon.png
          
          # Copy only production files from dev
          git checkout dev -- manifest.json background.js content.js images/ README.md
          git checkout dev -- extension/dist
          
          # Add only production files
          git add manifest.json background.js content.js images/ README.md
          git add -f extension/dist/
          
          git commit -m "release: auto-build from dev" || echo "nothing to commit"
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
